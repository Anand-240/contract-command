name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: contractcommand_test
          POSTGRES_USER: contractcommand
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contractcommand -d contractcommand_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://contractcommand:ci-postgres-password@127.0.0.1:5432/contractcommand_test
      DB_SSLMODE: disable
      POSTGRES_PASSWORD: ci-postgres-password
      DJANGO_SECRET_KEY: ci-only-key-never-used-in-deployment
      DJANGO_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Verify Django and PostgreSQL
        working-directory: backend
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py collectstatic --noinput
          python manage.py test core --noinput
          python manage.py spectacular --validate --file /tmp/contractcommand-openapi.yaml
      - name: Build frontend
        run: |
          npm ci
          npm run build
      - name: Verify and build Docker images
        run: |
          docker compose -f docker-compose.yml -f docker-compose.local.yml config -q
          docker build -f backend/Dockerfile backend
          docker build -f Dockerfile.frontend --build-arg VITE_DEMO_MODE=0 .

  publish:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_prefix: ${{ steps.names.outputs.prefix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select lowercase GHCR image names
        id: names
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Sign in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and publish backend
        run: |
          docker build -t "${{ steps.names.outputs.prefix }}-backend:${GITHUB_SHA}" backend
          docker push "${{ steps.names.outputs.prefix }}-backend:${GITHUB_SHA}"
      - name: Build and publish frontend
        run: |
          docker build -f Dockerfile.frontend --build-arg VITE_DEMO_MODE=0 -t "${{ steps.names.outputs.prefix }}-frontend:${GITHUB_SHA}" .
          docker push "${{ steps.names.outputs.prefix }}-frontend:${GITHUB_SHA}"

  deploy:
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Deploy verified images to Docker host
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          BACKEND_IMAGE: ${{ needs.publish.outputs.image_prefix }}-backend:${{ github.sha }}
          FRONTEND_IMAGE: ${{ needs.publish.outputs.image_prefix }}-frontend:${{ github.sha }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" 'mkdir -p "$HOME/contractcommand"'
          scp docker-compose.deploy.yml "$DEPLOY_USER@$DEPLOY_HOST:contractcommand/docker-compose.deploy.yml"
          scp Caddyfile "$DEPLOY_USER@$DEPLOY_HOST:contractcommand/Caddyfile"
          scp scripts/deploy_remote.sh "$DEPLOY_USER@$DEPLOY_HOST:contractcommand/deploy_remote.sh"
          printf '%s' "$GH_TOKEN" | ssh "$DEPLOY_USER@$DEPLOY_HOST" "docker login ghcr.io -u '$REGISTRY_USER' --password-stdin"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "BACKEND_IMAGE='$BACKEND_IMAGE' FRONTEND_IMAGE='$FRONTEND_IMAGE' sh ~/contractcommand/deploy_remote.sh"
