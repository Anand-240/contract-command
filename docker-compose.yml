services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      DB_SSLMODE: ${DB_SSLMODE:-require}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_SECURE_SSL: ${DJANGO_SECURE_SSL:-0}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      AUTH_TOKEN_TTL_HOURS: ${AUTH_TOKEN_TTL_HOURS:-8}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      DEMO_MODE: ${VITE_DEMO_MODE:-0}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - protected_media:/app/protected_media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 60s
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_DEMO_MODE: ${VITE_DEMO_MODE:-0}
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  protected_media:
